name: Bootstrap Skritter-style writing

on:
  push:
    branches:
      - agent/skritter-writing-0.21.0

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply independent writing overhaul
        shell: bash
        run: |
          cat > /tmp/apply.mjs.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/apply.mjs.gz.b64 | gzip -d > /tmp/apply.mjs
          node /tmp/apply.mjs
      - name: Persist generated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            AppRoot.tsx \
            app.json \
            package.json \
            src/components/KanjiWritingPanel.tsx \
            src/components/SkritterWritingPad.tsx \
            src/components/PracticeCard.tsx \
            src/screens/CourseScreen.tsx \
            src/screens/KanjiScreen.tsx
          git commit -m "Implement Skritter-style writing workflow [skip bootstrap]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
