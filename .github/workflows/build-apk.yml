name: Build Android APK

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: release.keystore

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      # REVIEW_AUDIT_PATCH_START
      - name: Apply review audit fixes once
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run targeted review audit patch'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}\n--- OLD ---\n{old}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/content/kanjiCurriculum.ts",
              '    prompt: `Как читается выделенный знак ${item.literal} в слове ${example.written}（${example.reading}）?`,',
              '    prompt: `Как читается знак ${item.literal} в слове ${example.written}?`,',
          )
          replace_once(
              "src/content/kanjiCurriculum.ts",
              '  prompt: `Напиши кандзи ${item.literal} в правильном порядке черт.`,',
              '  prompt: `Напиши по памяти кандзи со значением «${item.meaningsRu[0] ?? "заданное значение"}» в правильном порядке черт.`,',
          )

          replace_once(
              "src/screens/TrainingScreens.tsx",
              '''}: ReviewScreenProps) {
            return (''',
              '''}: ReviewScreenProps) {
            const hidesKanjiWritingAnswer =
              currentExercise.skill === "writing" &&
              currentExercise.contentKey?.startsWith("kanji:") === true;
            const visibleFocusLabel = hidesKanjiWritingAnswer
              ? focusLabel.replace(/^.+? — /u, "")
              : focusLabel;
            const visibleTitle = focusLabel === "Материал урока"
              ? lessonTitle
              : hidesKanjiWritingAnswer
                ? "Письмо по памяти"
                : visibleFocusLabel.split(" · ")[0];

            return (''',
          )
          replace_once(
              "src/screens/TrainingScreens.tsx",
              '          <Text style={styles.title}>{lessonTitle}</Text>',
              '          <Text style={styles.title}>{visibleTitle}</Text>',
          )
          replace_once(
              "src/screens/TrainingScreens.tsx",
              '            Сейчас проверяем: {focusLabel === "Материал урока" ? currentExercise.prompt : focusLabel}',
              '            Сейчас проверяем: {visibleFocusLabel === "Материал урока" ? currentExercise.prompt : visibleFocusLabel}',
          )

          replace_once(
              "src/components/SkritterExactWritingPad.tsx",
              '  const [feedback, setFeedback] = useState(modeInstruction(mode));',
              '  const [feedback, setFeedback] = useState("");',
          )
          replace_once(
              "src/components/SkritterExactWritingPad.tsx",
              '    setFeedback(modeInstruction(mode));',
              '    setFeedback("");',
          )
          replace_once(
              "src/components/SkritterExactWritingPad.tsx",
              '      <Text style={styles.feedback}>{feedback}</Text>',
              '      {feedback.length > 0 && <Text style={styles.feedback}>{feedback}</Text>}',
          )

          replace_once(
              "src/theme/appStyles.ts",
              'import { StyleSheet } from "react-native";',
              'import { Platform, StatusBar, StyleSheet } from "react-native";',
          )
          replace_once(
              "src/theme/appStyles.ts",
              '  safeArea: { flex: 1, backgroundColor: "#F6F3EC" },',
              '''  safeArea: {
              flex: 1,
              paddingTop: Platform.OS === "android" ? (StatusBar.currentHeight ?? 0) : 0,
              backgroundColor: "#F6F3EC",
            },''',
          )

          replace_once(
              "src/engine/checkAnswer.ts",
              '''const courseReadingAliases: ReadingAlias[] = Array.from(
            new Map(
              lessonBundles
                .flatMap((bundle) => bundle.vocabulary)
                .filter((item) => item.writtenForm !== item.reading)
                .map((item) => [item.writtenForm, item.reading] as const),
            ).entries(),
          )
            .map(([writtenForm, reading]) => ({ writtenForm, reading }))
            .sort((left, right) => right.writtenForm.length - left.writtenForm.length);''',
              '''const createReadingAliases = (
            writtenForm: string,
            reading: string,
          ): ReadingAlias[] => {
            const aliases: ReadingAlias[] = [{ writtenForm, reading }];
            if (writtenForm.endsWith("ます") && reading.endsWith("ます")) {
              const writtenStem = writtenForm.slice(0, -2);
              const readingStem = reading.slice(0, -2);
              if (writtenStem && readingStem && writtenStem !== readingStem) {
                aliases.push({ writtenForm: writtenStem, reading: readingStem });
              }
            }
            return aliases;
          };

          const courseReadingAliases: ReadingAlias[] = Array.from(
            new Map(
              lessonBundles
                .flatMap((bundle) => bundle.vocabulary)
                .filter((item) => item.writtenForm !== item.reading)
                .flatMap((item) => createReadingAliases(item.writtenForm, item.reading))
                .map((alias) => [alias.writtenForm, alias.reading] as const),
            ).entries(),
          )
            .map(([writtenForm, reading]) => ({ writtenForm, reading }))
            .sort((left, right) => right.writtenForm.length - left.writtenForm.length);''',
          )

          replace_once(
              "src/content/lesson010.ts",
              '''    acceptableAnswers: [
              "昨日学校へ行きませんでした",
              "昨日学校へ行きませんでした。",
              "きのうはがっこうへいきませんでした",
              "きのうはがっこうへいきませんでした。"
            ],''',
              '''    acceptableAnswers: [
              "昨日学校へ行きませんでした",
              "昨日学校へ行きませんでした。",
              "昨日学校に行きませんでした",
              "昨日学校に行きませんでした。",
              "きのうはがっこうへいきませんでした",
              "きのうはがっこうへいきませんでした。"
            ],''',
          )

          replace_once(
              "src/engine/checkAnswer.test.ts",
              'import { lesson007Exercises } from "../content/lesson007.ts";',
              'import { lesson007Exercises } from "../content/lesson007.ts";\nimport { lesson010Exercises } from "../content/lesson010.ts";',
          )
          replace_once(
              "src/engine/checkAnswer.test.ts",
              '''test("time answers accept Arabic digits and optional 今は", () => {''',
              '''test("past negative destination accepts omitted topic, に and a kana verb stem", () => {
            const exercise = lesson010Exercises.find(
              (item) => item.id === "exercise-kinou-gakkou-input",
            );
            assert.ok(exercise);

            const result = checkAnswer(
              "昨日学校にいきませんでした",
              exercise.correctAnswers,
              exercise.acceptableAnswers,
            );

            assert.equal(result.status, "acceptable");
            assert.equal(
              checkAnswer("いきませんでした", ["行きませんでした"]).status,
              "correct",
            );
          });

          test("time answers accept Arabic digits and optional 今は", () => {''',
          )

          replace_once(
              "src/content/kanjiCurriculum.test.ts",
              '''test("explicit exercise skill overrides the generic interaction type", () => {''',
              '''test("kanji review prompts never print the answer being tested", () => {
            const reviewExercises = lessonBundles.flatMap(
              (bundle) => bundle.reviewExercises ?? bundle.exercises,
            );
            const readingExercises = reviewExercises.filter(
              (exercise) =>
                exercise.skill === "reading" &&
                exercise.contentKey?.startsWith("kanji:"),
            );
            const writingExercises = reviewExercises.filter(
              (exercise) =>
                exercise.skill === "writing" &&
                exercise.contentKey?.startsWith("kanji:"),
            );

            assert.ok(readingExercises.length > 0);
            assert.ok(writingExercises.length > 0);
            readingExercises.forEach((exercise) => {
              assert.doesNotMatch(exercise.prompt, /（[^）]+）/u);
            });
            writingExercises.forEach((exercise) => {
              const literal = exercise.correctAnswers[0];
              assert.ok(literal);
              assert.equal(
                exercise.prompt.includes(literal),
                false,
                `${exercise.id} reveals ${literal} in its recall prompt`,
              );
            });
          });

          test("explicit exercise skill overrides the generic interaction type", () => {''',
          )

          replace_once(
              "package.json",
              '  "version": "0.22.1",',
              '  "version": "0.22.2",',
          )
          replace_once(
              "app.json",
              '    "version": "0.22.1",',
              '    "version": "0.22.2",',
          )
          replace_once(
              "app.json",
              '      "versionCode": 47,',
              '      "versionCode": 48,',
          )

          temporary = Path(".github/workflows/apply-review-audit-fixes.yml")
          if temporary.exists():
              temporary.unlink()

          workflow = Path(".github/workflows/build-apk.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          workflow_text = workflow_text.replace(
              "permissions:\n  contents: write",
              "permissions:\n  contents: read",
              1,
          )
          workflow_text, count = re.subn(
              r"\n      # REVIEW_AUDIT_PATCH_START.*?\n      # REVIEW_AUDIT_PATCH_END\n",
              "\n",
              workflow_text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("Could not remove temporary build workflow patch")
          workflow.write_text(workflow_text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix misleading review prompts and answer validation"
          git push origin HEAD:agent/kanji-study-cycle-0.22.0
      # REVIEW_AUDIT_PATCH_END

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Run full test suite
        run: npm test

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Validate signing secrets
        shell: bash
        run: |
          values=(
            "$ANDROID_KEYSTORE_BASE64"
            "$ANDROID_KEYSTORE_PASSWORD"
            "$ANDROID_KEY_ALIAS"
            "$ANDROID_KEY_PASSWORD"
          )
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -ne 0 && "$present" -ne 4 ]]; then
            echo "Android signing secrets are only partially configured." >&2
            exit 1
          fi
          if [[ "$present" -eq 4 ]]; then
            echo "HAS_RELEASE_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=0" >> "$GITHUB_ENV"
          fi

      - name: Configure protected release signing
        if: env.HAS_RELEASE_SIGNING == '1'
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "android/app/$ANDROID_KEYSTORE_FILE"
          node scripts/configure-android-release-signing.mjs

      - name: Build standalone APK
        run: cd android && ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: Verify standalone bundle, permissions and signature
        shell: bash
        run: |
          mkdir -p builds
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | tee builds/apk-contents.log
          unzip -l "$APK" | grep -q "assets/index.android.bundle"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump permissions "$APK" | tee builds/apk-permissions.log
          ! grep -Eq 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|SYSTEM_ALERT_WINDOW' builds/apk-permissions.log

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee builds/apk-signature.log
          if [[ "$HAS_RELEASE_SIGNING" == "1" ]]; then
            ! grep -qi 'Android Debug' builds/apk-signature.log
            echo "Protected release keystore" > builds/signing-status.txt
          else
            grep -qi 'Android Debug' builds/apk-signature.log
            echo "Personal standalone fallback: Android Debug certificate" > builds/signing-status.txt
          fi

          cp "$APK" "builds/Japanese-${APP_VERSION}-standalone.apk"
          sha256sum "builds/Japanese-${APP_VERSION}-standalone.apk" | tee builds/apk.sha256

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-${{ env.APP_VERSION }}-standalone
          path: |
            builds/*.apk
            builds/apk.sha256
            builds/apk-contents.log
            builds/apk-permissions.log
            builds/apk-signature.log
            builds/signing-status.txt
          if-no-files-found: error
          retention-days: 14
