name: Build Android APK

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "1"

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Run full test suite
        run: npm test

      - name: Run application TypeScript check
        run: npm run typecheck

      - name: Run test TypeScript check
        run: npm run typecheck:tests

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish branch APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        run: |
          mkdir -p builds
          cp android/app/build/outputs/apk/debug/app-debug.apk builds/Japanese-0.11.0-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- builds/Japanese-0.11.0-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "Publish Japanese 0.11.0 APK [skip build]"
          git push
