name: Build Android APK

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Run full test suite
        run: npm test

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: cd android && ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: Verify standalone bundle
        shell: bash
        run: |
          mkdir -p builds
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | tee builds/apk-contents.log
          unzip -l "$APK" | grep -q "assets/index.android.bundle"
          cp "$APK" "builds/Japanese-${APP_VERSION}-standalone.apk"
          sha256sum "builds/Japanese-${APP_VERSION}-standalone.apk" | tee builds/apk.sha256

      - name: Pack exact source snapshot
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -czf builds/japanese-source-audit.tar.gz

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-${{ env.APP_VERSION }}-standalone
          path: |
            builds/*.apk
            builds/apk.sha256
            builds/apk-contents.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: japanese-source-audit
          path: builds/japanese-source-audit.tar.gz
          if-no-files-found: error
          retention-days: 1
