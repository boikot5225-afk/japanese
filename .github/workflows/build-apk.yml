name: Build Android APK

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "1"

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p builds
          set -o pipefail
          npm install 2>&1 | tee builds/install.log

      - name: Run full test suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee builds/tests.log

      - name: Run application TypeScript check
        id: app_types
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee builds/typecheck-app.log

      - name: Run test TypeScript check
        id: test_types
        if: steps.app_types.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:tests 2>&1 | tee builds/typecheck-tests.log

      - name: Generate Android project
        id: prebuild
        if: steps.test_types.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee builds/prebuild.log

      - name: Build debug APK
        id: gradle
        if: steps.prebuild.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../builds/gradle.log

      - name: Upload workflow APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview release
        id: release
        if: steps.gradle.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="build-0.11.0-preview"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK#Japanese-0.11.0-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "Japanese Tutor 0.11.0 preview" \
            --notes "Тестовая Android-сборка уроков 1–16, исправленного текстового ввода и навигации жестами." \
            --prerelease

      - name: Publish build report to branch
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          APP_TYPES_OUTCOME: ${{ steps.app_types.outcome }}
          TEST_TYPES_OUTCOME: ${{ steps.test_types.outcome }}
          PREBUILD_OUTCOME: ${{ steps.prebuild.outcome }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        shell: bash
        run: |
          mkdir -p builds
          {
            echo "source_commit=$GITHUB_SHA"
            echo "install=$INSTALL_OUTCOME"
            echo "tests=$TESTS_OUTCOME"
            echo "typecheck_app=$APP_TYPES_OUTCOME"
            echo "typecheck_tests=$TEST_TYPES_OUTCOME"
            echo "prebuild=$PREBUILD_OUTCOME"
            echo "gradle=$GRADLE_OUTCOME"
            echo "release=$RELEASE_OUTCOME"
          } > builds/build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- builds/build-status.txt builds/*.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Report Japanese 0.11.0 build [skip build]"
          git push

      - name: Enforce successful build
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          APP_TYPES_OUTCOME: ${{ steps.app_types.outcome }}
          TEST_TYPES_OUTCOME: ${{ steps.test_types.outcome }}
          PREBUILD_OUTCOME: ${{ steps.prebuild.outcome }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        shell: bash
        run: |
          test "$INSTALL_OUTCOME" = success
          test "$TESTS_OUTCOME" = success
          test "$APP_TYPES_OUTCOME" = success
          test "$TEST_TYPES_OUTCOME" = success
          test "$PREBUILD_OUTCOME" = success
          test "$GRADLE_OUTCOME" = success
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/agent/* ]]; then
            test "$RELEASE_OUTCOME" = success
          fi
