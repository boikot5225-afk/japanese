name: Build Android APK

on:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  CI: "1"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report build started
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=agent-apk-build \
            -f description="Standalone Android build started" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate kanji writing state
        run: node scripts/apply-kanji-writing-integration.mjs

      - name: Generate pinned KanjiVG N5 dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache/kanjivg-release
          mkdir -p .cache/kanjivg-release
          curl --fail --location \
            "https://github.com/KanjiVG/kanjivg/releases/download/r20250816/kanjivg-20250816-main.zip" \
            --output .cache/kanjivg-main.zip
          unzip -q .cache/kanjivg-main.zip -d .cache/kanjivg-release
          KANJI_DIR="$(dirname "$(find .cache/kanjivg-release -name 065e5.svg -print -quit)")"
          test -n "$KANJI_DIR"
          node scripts/generate-kanji-strokes.mjs "$KANJI_DIR"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/content/kanjiStrokeData.ts','utf8');const n=(s.match(/source:\"KanjiVG\"/g)||[]).length;if(n!==103)throw new Error('Expected 103 kanji, got '+n);"

      - name: Persist generated source
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        shell: bash
        run: |
          if git diff --quiet -- AppRoot.tsx src/content/kanjiStrokeData.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppRoot.tsx src/content/kanjiStrokeData.ts
          git commit -m "Generate N5 stroke data and wire writing [skip build]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Read application version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p builds
          set -o pipefail
          npm install 2>&1 | tee builds/install.log

      - name: Run full test suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee builds/tests.log

      - name: Run application TypeScript check
        id: app_types
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee builds/typecheck-app.log

      - name: Run test TypeScript check
        id: test_types
        if: steps.app_types.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:tests 2>&1 | tee builds/typecheck-tests.log

      - name: Generate Android project
        id: prebuild
        if: steps.test_types.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee builds/prebuild.log

      - name: Build standalone release APK
        id: gradle
        if: steps.prebuild.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ../builds/gradle.log

      - name: Verify packaged JavaScript bundle
        id: bundle
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | tee builds/apk-contents.log
          unzip -l "$APK" | grep -q "assets/index.android.bundle"
          cp "$APK" "builds/Japanese-${APP_VERSION}-standalone.apk"
          echo "Verified assets/index.android.bundle in standalone APK" | tee builds/bundle-verification.log

      - name: Upload standalone APK artifact
        if: steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-${{ env.APP_VERSION }}-standalone
          path: builds/Japanese-${{ env.APP_VERSION }}-standalone.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview release
        id: release
        if: steps.bundle.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="build-${APP_VERSION}-preview"
          APK="builds/Japanese-${APP_VERSION}-standalone.apk"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Japanese Tutor ${APP_VERSION} standalone preview" \
            --notes "Автономная Android-сборка с порядком черт KanjiVG, автоматической проверкой письма и упакованным JavaScript bundle." \
            --prerelease

      - name: Report final build status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          APP_TYPES_OUTCOME: ${{ steps.app_types.outcome }}
          TEST_TYPES_OUTCOME: ${{ steps.test_types.outcome }}
          PREBUILD_OUTCOME: ${{ steps.prebuild.outcome }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        shell: bash
        run: |
          STATE=failure
          DESCRIPTION="Standalone APK build failed"
          if [[ "$INSTALL_OUTCOME" == success && \
                "$TESTS_OUTCOME" == success && \
                "$APP_TYPES_OUTCOME" == success && \
                "$TEST_TYPES_OUTCOME" == success && \
                "$PREBUILD_OUTCOME" == success && \
                "$GRADLE_OUTCOME" == success && \
                "$BUNDLE_OUTCOME" == success ]]; then
            if [[ "$GITHUB_REF" != refs/heads/agent/* || "$RELEASE_OUTCOME" == success ]]; then
              STATE=success
              DESCRIPTION="Standalone APK includes validated kanji strokes"
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context=agent-apk-build \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Enforce successful build
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          APP_TYPES_OUTCOME: ${{ steps.app_types.outcome }}
          TEST_TYPES_OUTCOME: ${{ steps.test_types.outcome }}
          PREBUILD_OUTCOME: ${{ steps.prebuild.outcome }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        shell: bash
        run: |
          test "$INSTALL_OUTCOME" = success
          test "$TESTS_OUTCOME" = success
          test "$APP_TYPES_OUTCOME" = success
          test "$TEST_TYPES_OUTCOME" = success
          test "$PREBUILD_OUTCOME" = success
          test "$GRADLE_OUTCOME" = success
          test "$BUNDLE_OUTCOME" = success
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/agent/* ]]; then
            test "$RELEASE_OUTCOME" = success
          fi
