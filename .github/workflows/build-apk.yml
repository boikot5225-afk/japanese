name: Build Android APK

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: writing-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply audited fixes
        shell: bash
        run: |
          if [[ "$(node -p "require('./package.json').version")" == "0.21.0" ]]; then
            node scripts/fix-writing-audit-script.mjs
            node scripts/apply-writing-audit.mjs
            node scripts/apply-writing-audit-hotfix.mjs
          fi
          node scripts/apply-writing-grade-cap-ui.mjs

      - name: Persist audited fixes
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            package.json app.json AppRoot.tsx \
            src/engine/writingSession.ts \
            src/engine/writingSession.test.ts \
            src/engine/lessonSession.ts \
            src/engine/lessonReview.ts \
            src/engine/lessonReview.test.ts \
            src/components/SkritterWritingPad.tsx \
            src/components/KanjiWritingPanel.tsx \
            src/screens/KanjiScreen.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enforce audited writing grade limits [skip build]"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Read version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Run full tests
        run: npm test

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: cd android && ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: Verify standalone bundle
        shell: bash
        run: |
          mkdir -p builds
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"
          cp "$APK" "builds/Japanese-${APP_VERSION}-standalone.apk"
          sha256sum "builds/Japanese-${APP_VERSION}-standalone.apk" > builds/apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-${{ env.APP_VERSION }}-standalone
          path: |
            builds/Japanese-${{ env.APP_VERSION }}-standalone.apk
            builds/apk.sha256
          if-no-files-found: error
          retention-days: 14
