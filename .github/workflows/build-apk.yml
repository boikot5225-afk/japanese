name: Build Android APK

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-audit-fixes:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: run audited fix bundle [skip build]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/kanji-study-cycle-0.22.0
          fetch-depth: 1

      - name: Rebuild and verify audited patch
        shell: bash
        run: |
          cat .github/audit-patch.part00 .github/audit-patch.part01 | base64 --decode > /tmp/audit-fix.patch.gz
          echo 'd3b87e6ec33ee6ee30ac1bb455be5ee090983a16f3ed88f9c7a6929c5c2cbfcc  /tmp/audit-fix.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/audit-fix.patch.gz > /tmp/audit-fix.patch
          git apply --check --exclude=.github/workflows/build-apk.yml /tmp/audit-fix.patch
          git apply --index --exclude=.github/workflows/build-apk.yml /tmp/audit-fix.patch

      - name: Restore final workflow and remove transport
        shell: bash
        run: |
          base64 --decode --ignore-garbage .github/final-build-workflow.b64 > .github/workflows/build-apk.yml
          echo '0f6266d354f9add70749ddccb83d53a0f03d853edd47d1028843b80254ec53a7  .github/workflows/build-apk.yml' | sha256sum --check --strict
          git add -- .github/workflows/build-apk.yml
          git rm -- .github/audit-patch.part00 .github/audit-patch.part01 .github/audit-trigger .github/final-build-workflow.b64 .github/workflows/apply-audit-fix.yml

      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix: harden kanji lessons and review timing'
          git push origin HEAD:agent/kanji-study-cycle-0.22.0

  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      - name: Pack exact source snapshot
        shell: bash
        run: |
          mkdir -p builds
          git ls-files -z | tar --null -T - -czf builds/japanese-source-audit.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: japanese-source-audit
          path: builds/japanese-source-audit.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Run full test suite
        run: npm test

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: cd android && ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: Verify standalone bundle
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | tee builds/apk-contents.log
          unzip -l "$APK" | grep -q "assets/index.android.bundle"
          cp "$APK" "builds/Japanese-${APP_VERSION}-standalone.apk"
          sha256sum "builds/Japanese-${APP_VERSION}-standalone.apk" | tee builds/apk.sha256

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-${{ env.APP_VERSION }}-standalone
          path: |
            builds/*.apk
            builds/apk.sha256
            builds/apk-contents.log
          if-no-files-found: error
          retention-days: 14
