name: Apply lesson kanji repair

on:
  push:
    branches:
      - "agent/kanji-study-cycle-0.22.0"
    paths:
      - "scripts/apply-lesson-kanji-repair.mjs"
      - ".github/workflows/apply-lesson-kanji-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[lesson-kanji-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch verified KanjiVG source
        run: |
          rm -rf .cache/kanjivg
          git clone --depth 1 https://github.com/KanjiVG/kanjivg.git .cache/kanjivg

      - name: Apply curriculum repair and generate strokes
        run: node scripts/apply-lesson-kanji-repair.mjs

      - name: Install dependencies
        run: npm install

      - name: Run full validation
        run: |
          npm test
          npm run typecheck
          npm run typecheck:tests

      - name: Commit repaired source
        shell: bash
        run: |
          rm -rf .cache/kanjivg
          rm -f scripts/apply-lesson-kanji-repair.mjs
          rm -f .github/workflows/apply-lesson-kanji-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Teach kanji before lesson tests [lesson-kanji-applied]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
