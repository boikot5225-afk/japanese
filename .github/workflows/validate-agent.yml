name: Validate adjective course branch

on:
  push:
    branches:
      - agent/n5-adjectives-0.11.0

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run all tests
        run: npm test

      - name: Run TypeScript check
        run: npm run typecheck
