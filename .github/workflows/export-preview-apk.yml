name: Export Preview APK

on:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read
  statuses: write

jobs:
  export-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Report export started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=apk-export \
            -f description="Preparing APK download" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Download preview APK
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download build-0.11.0-preview \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Japanese-0.11.0-debug.apk" \
            --dir exported

      - name: Upload APK artifact
        id: upload
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-0.11.0-debug
          path: exported/Japanese-0.11.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report export result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          STATE=failure
          DESCRIPTION="APK export failed"
          if [[ "$DOWNLOAD_OUTCOME" == success && "$UPLOAD_OUTCOME" == success ]]; then
            STATE=success
            DESCRIPTION="APK ready to download"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context=apk-export \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$STATE" = success
