name: Apply contextual kanji word fix

on:
  push:
    branches:
      - "agent/kanji-study-cycle-0.22.0"

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[contextual-kanji-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply repair and validate
        shell: bash
        run: |
          node scripts/apply-contextual-kanji-word-fix.mjs
          npm install
          npm test
          npm run typecheck
          npm run typecheck:tests
          rm -f scripts/apply-contextual-kanji-word-fix.mjs
          rm -f .github/workflows/apply-contextual-kanji-word-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show full compounds for contextual kanji [contextual-kanji-applied]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
