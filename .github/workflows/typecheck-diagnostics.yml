name: Capture TypeScript diagnostics

on:
  push:
    branches:
      - agent/kanji-strokes-0.20.0

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip diagnostics]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Capture application typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > TYPECHECK_FAILURE.log 2>&1
          CODE=$?
          set -e
          if [[ "$CODE" -eq 0 ]]; then
            echo "Typecheck passed." > TYPECHECK_FAILURE.log
          fi
      - name: Persist diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TYPECHECK_FAILURE.log
          git commit -m "Capture TypeScript diagnostics [skip diagnostics] [skip build]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
