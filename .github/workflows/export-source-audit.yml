name: Export source audit snapshot

on:
  push:
    branches:
      - "agent/kanji-study-cycle-0.22.0"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pack tracked source
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -czf japanese-source-audit.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: japanese-source-audit
          path: japanese-source-audit.tar.gz
          if-no-files-found: error
          retention-days: 1
